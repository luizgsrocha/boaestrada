<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoaEstrada</title></head>
<body>
<h1>BoaEstrada</h1>
<p>Pesquise a origem e o destino. Selecione uma sugestão GPS para gerar links com origem e destino explícitos.</p>
<form id="route-form">
<label>Origem <input id="origin" autocomplete="off" required></label><div id="origin-results"></div>
<label>Destino <input id="destination" autocomplete="off" required></label><div id="destination-results"></div>
<label><input id="avoid" type="checkbox" checked> Evitar pedágio Free Flow</label>
<button>Calcular rota</button>
</form>
<pre id="result"></pre>
<script>
const chosen={origin:null,destination:null};
function autocomplete(id){const input=document.getElementById(id),box=document.getElementById(id+"-results");let timer;input.oninput=()=>{chosen[id]=null;clearTimeout(timer);if(input.value.length<3){box.innerHTML="";return}timer=setTimeout(async()=>{const data=await fetch("/api/search?q="+encodeURIComponent(input.value)).then(r=>r.json());box.innerHTML=data.map((x,i)=>"<button type='button' data-i='"+i+"'>"+x.label+"</button>").join("<br>");[...box.querySelectorAll("button")].forEach((b,i)=>b.onclick=()=>{chosen[id]=data[i];input.value=data[i].label;box.innerHTML=""})},350)}}
autocomplete("origin");autocomplete("destination");
document.getElementById("route-form").onsubmit=async e=>{e.preventDefault();const body={origin:chosen.origin||{label:origin.value},destination:chosen.destination||{label:destination.value},avoid:avoid.checked?["free_flow"]:[]};const data=await fetch("/api/routes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());result.textContent=JSON.stringify(data,null,2)};
</script>
</body></html>
