name: Deploy BoaEstrada to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: boaestrada-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Stamp release metadata into served HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stamp-release.mjs
      - name: Validate bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/boaestrada-bundle
      - name: Ensure Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment."
            exit 1
          fi
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify published release
        run: |
          set -euo pipefail
          URL="https://boaestrada.lgsr96.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/" | grep -q "Versão do site:"
          echo "Release ${GITHUB_SHA} published and verified at $URL"
