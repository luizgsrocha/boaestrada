name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and API integration tests
        run: npm test
      - name: Wrangler dry-run bundle (does not deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/boaestrada-bundle
      - name: Real Nominatim and OSRM HTTP smoke (non-blocking)
        continue-on-error: true
        run: node scripts/provider-smoke.mjs
